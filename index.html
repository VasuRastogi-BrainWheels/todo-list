<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="navbar-container">
            <div class="navbar-brand" onclick="showAbout()">
                <span>📝</span>
                <span>Todo Pro</span>
            </div>
            <ul class="navbar-menu">
                <button class="navbar-btn" onclick="clearCompleted()" title="Clear all completed tasks">
                    <span>🗑️</span> Clear Completed
                </button>
                <div class="separator"></div>
                <button class="navbar-btn" onclick="exportTodos()" title="Export tasks as JSON">
                    <span>📥</span> Export
                </button>
                <button class="navbar-btn" onclick="importTodos()" title="Import tasks from JSON">
                    <span>📤</span> Import
                </button>
                <div class="separator"></div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
                    🌙
                </button>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>📝 My Todo List</h1>
        
        <div class="input-container">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                autocomplete="off"
            >
            <select id="prioritySelect" aria-label="Task Priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
            <button onclick="addTodo()">Add</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="empty-state" id="emptyState">
            No tasks yet. Add one to get started! 🎯
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalCount">0</div>
                <div>Total</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedCount">0</div>
                <div>Completed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="remainingCount">0</div>
                <div>Remaining</div>
            </div>
        </div>
    </div>

    <!-- Transparent/Dimmed Blocking Backdrop & Centered Dialog -->
    <div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogMessage">
        <div class="dialog-box">
            <p class="dialog-message" id="dialogMessage"></p>
            <div class="dialog-actions">
                <button type="button" class="dialog-cancel-btn" id="dialogCancelBtn">Cancel</button>
                <button type="button" id="dialogOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        const todoInput = document.getElementById('todoInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');

        const dialogBackdrop = document.getElementById('dialogBackdrop');
        const dialogMessage = document.getElementById('dialogMessage');
        const dialogOkBtn = document.getElementById('dialogOkBtn');
        const dialogCancelBtn = document.getElementById('dialogCancelBtn');

        // Custom centered dialog (supports both alert mode and confirm mode)
        function showDialog(message, { isConfirm = false } = {}) {
            return new Promise((resolve) => {
                dialogMessage.textContent = message;
                dialogCancelBtn.style.display = isConfirm ? 'inline-block' : 'none';
                dialogBackdrop.classList.add('active');
                dialogOkBtn.focus();

                function cleanup(result) {
                    dialogBackdrop.classList.remove('active');
                    dialogOkBtn.removeEventListener('click', onOk);
                    dialogCancelBtn.removeEventListener('click', onCancel);
                    document.removeEventListener('keydown', onKeyDown);
                    resolve(result);
                }

                function onOk() {
                    cleanup(true);
                }

                function onCancel() {
                    cleanup(false);
                }

                function onKeyDown(e) {
                    if (e.key === 'Escape') {
                        cleanup(isConfirm ? false : true);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        cleanup(true);
                    }
                }

                dialogOkBtn.addEventListener('click', onOk);
                dialogCancelBtn.addEventListener('click', onCancel);
                document.addEventListener('keydown', onKeyDown);
            });
        }

        // Sample todos with priority
        const sampleTodos = [
            { text: 'Learn Git basics', priority: 'High', completed: false },
            { text: 'Continue with siger', priority: 'Medium', completed: false },
            { text: 'Practice Git commands', priority: 'Medium', completed: true },
            { text: 'Review data analytics course', priority: 'Low', completed: false },
            { text: 'Prepare project presentation', priority: 'High', completed: false }
        ];

        // Initialize with sample data
        let todos = JSON.parse(localStorage.getItem('todos')) || sampleTodos;

        // Load todos on page load
        function loadTodos() {
            todoList.innerHTML = '';
            
            if (todos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                todos.forEach((todo, index) => {
                    addTodoElement(todo, index);
                });
            }
            
            updateStats();
        }

        function addTodoElement(todo, index) {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            
            // Add stagger animation delay
            li.style.animationDelay = `${index * 0.05}s`;

            const priority = todo.priority || 'Medium';
            
            li.innerHTML = `
                <input 
                    type="checkbox" 
                    class="checkbox" 
                    ${todo.completed ? 'checked' : ''} 
                    onchange="toggleTodo(${index})"
                >
                <span class="todo-text">${escapeHtml(todo.text)} (${escapeHtml(priority)})</span>
                <button class="delete-btn" onclick="deleteTodo(${index})">Delete</button>
            `;
            
            todoList.appendChild(li);
        }

        async function addTodo() {
            const text = todoInput.value.trim();
            const priority = prioritySelect.value;
            
            if (text === '') {
                await showDialog('Please enter a task!');
                todoInput.focus();
                return;
            }
            
            todos.push({ text: text, priority: priority, completed: false });
            todoInput.value = '';
            prioritySelect.value = 'Medium';
            saveTodos();
            loadTodos();
            todoInput.focus();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos();
            loadTodos();
        }

        async function deleteTodo(index) {
            const todo = todos[index];

            if (todo.priority === 'High' && !todo.completed) {
                await showDialog('⚠️ High priority tasks cannot be deleted until they are marked as done!');
                return;
            }

            const confirmed = await showDialog('Are you sure you want to delete this task?', { isConfirm: true });
            if (confirmed) {
                const todoItems = document.querySelectorAll('.todo-item');
                todoItems[index].classList.add('deleting');
                
                setTimeout(() => {
                    todos.splice(index, 1);
                    saveTodos();
                    loadTodos();
                }, 400);
            }
        }

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const remaining = total - completed;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('remainingCount').textContent = remaining;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to add todo when no dialog is active
        todoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !dialogBackdrop.classList.contains('active')) {
                addTodo();
            }
        });

        // Load todos on page load
        loadTodos();

        // Initialize theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }

        // Navbar Functions
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const themeToggle = document.querySelector('.theme-toggle');
            
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙';
            }
        }

        async function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            
            if (completedCount === 0) {
                await showDialog('No completed tasks to clear!');
                return;
            }
            
            const confirmed = await showDialog(`Clear ${completedCount} completed task(s)?`, { isConfirm: true });
            if (confirmed) {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                loadTodos();
            }
        }

        async function exportTodos() {
            const dataStr = JSON.stringify(todos, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `todos-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            await showDialog('✅ Tasks exported successfully!');
        }

        function importTodos() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = async (event) => {
                    try {
                        const importedTodos = JSON.parse(event.target.result);
                        
                        if (!Array.isArray(importedTodos)) {
                            throw new Error('Invalid format');
                        }
                        
                        const confirmed = await showDialog('Replace current tasks with imported ones?', { isConfirm: true });
                        if (confirmed) {
                            todos = importedTodos;
                            saveTodos();
                            loadTodos();
                            await showDialog('✅ Tasks imported successfully!');
                        }
                    } catch (err) {
                        await showDialog('❌ Error importing file. Make sure it\'s a valid JSON file.');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        async function showAbout() {
            await showDialog('📝 Todo Pro\n\nA beautiful, feature-rich todo list application.\n\nFeatures:\n✅ Add, complete, and delete tasks\n🚦 Task priority levels (Low, Medium, High)\n🌙 Dark/Light mode\n💾 Auto-save to local storage\n📥 Export/Import tasks\n📊 Live statistics\n\nMade with ❤️ using HTML, CSS & JavaScript');
        }
    </script>
</body>
</html>
